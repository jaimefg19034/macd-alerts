name: ATR development-only optimization research

on:
  push:
    branches: [main]
    paths:
      - "scripts/atr_research.py"
      - "tests/test_atr_research.py"
      - ".github/workflows/atr-research.yml"
      - "scripts/atr_exits.py"
      - "scripts/backtest.py"
      - "scripts/strategy_filters.py"
      - "scripts/data_snapshot.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atr-research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Download common immutable OHLCV snapshot
        run: python scripts/data_snapshot.py --lookback-days 700 --output-dir reports/data_snapshot
      - name: Select ATR parameters on development data and test on untouched OOS folds
        run: |
          python scripts/atr_research.py --filter-mode ema_adx --costs 0.10 0.20 0.30 --data-dir reports/data_snapshot --output reports/atr_research/summary.json
      - name: Upload ATR research report and source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: atr-development-oos-research
          path: |
            reports/data_snapshot/
            reports/atr_research/
          if-no-files-found: error
