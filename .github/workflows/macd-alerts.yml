name: MACD hourly alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/macd-alerts.yml"
      - "scripts/macd_alerts.py"

permissions:
  contents: write

concurrency:
  group: macd-hourly-alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check completed hourly MACD candles
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/macd_alerts.py

      - name: Save processed candles and signal performance history
        if: always()
        run: |
          git add -f data/pending_crosses.json
          for file in data/signal_history.csv data/signal_stats.csv; do
            if [ -f "$file" ]; then
              git add -f "$file"
            fi
          done
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update MACD signal history and state"
            # Rebase on any code/documentation commit made while this scan was running.
            git pull --rebase origin main
            git push
          fi
