name: MACD historical backtest

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backtest.yml"
      - "scripts/backtest.py"
      - "scripts/risk_management.py"
      - "scripts/atr_exits.py"
      - "scripts/portfolio_sim.py"
      - "scripts/signal_quality.py"
      - "scripts/walk_forward.py"
      - "scripts/strategy_filters.py"
      - "tests/**"
  workflow_dispatch:
    inputs:
      cost_pct:
        description: "Estimated round-trip costs in percentage points (e.g. 0.10 = 0.10%)"
        required: true
        default: "0.10"
      filter_mode:
        description: "Signal filter applied to the fixed SL/TP variant"
        type: choice
        required: true
        default: "ema_adx_rsi"
        options:
          - "ema200"
          - "ema_adx"
          - "ema_adx_rsi"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run backtester tests
        run: python -m unittest discover -s tests -v

      - name: Run baseline and filtered backtests
        env:
          BACKTEST_COST_PCT: ${{ inputs.cost_pct || '0.10' }}
          FILTER_MODE: ${{ inputs.filter_mode || 'ema_adx_rsi' }}
        run: |
          python scripts/backtest.py --cost-pct "$BACKTEST_COST_PCT" --risk-mode macd --output-dir reports/backtest/macd_only
          python scripts/backtest.py --cost-pct "$BACKTEST_COST_PCT" --risk-mode fixed --output-dir reports/backtest/fixed_sl_tp
          python scripts/backtest.py --cost-pct "$BACKTEST_COST_PCT" --risk-mode fixed --filter-mode "$FILTER_MODE" --output-dir "reports/backtest/fixed_sl_tp_$FILTER_MODE"
          python scripts/backtest.py --cost-pct "$BACKTEST_COST_PCT" --risk-mode atr --output-dir reports/backtest/atr_1_5x_3x
          python scripts/backtest.py --cost-pct "$BACKTEST_COST_PCT" --risk-mode atr --filter-mode "$FILTER_MODE" --output-dir "reports/backtest/atr_1_5x_3x_$FILTER_MODE"
          python scripts/backtest.py --cost-pct 0.20 --risk-mode atr --filter-mode "$FILTER_MODE" --output-dir "reports/backtest/atr_1_5x_3x_$FILTER_MODE_cost_0_20"
          python scripts/backtest.py --cost-pct 0.30 --risk-mode atr --filter-mode "$FILTER_MODE" --output-dir "reports/backtest/atr_1_5x_3x_$FILTER_MODE_cost_0_30"
          python scripts/walk_forward.py --filter-mode "$FILTER_MODE" --costs 0.10 0.20 0.30 --output reports/walk_forward/summary.json

      - name: Upload backtest report
        uses: actions/upload-artifact@v4
        with:
          name: macd-backtest-report
          path: |
            reports/backtest/
            reports/walk_forward/
          if-no-files-found: error
