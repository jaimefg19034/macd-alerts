name: Telegram connection test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": "✅ Conexión correcta: tu sistema de alertas MACD está conectado a Telegram."
          }).encode()
          request = urllib.request.Request(url, data=data, method="POST")
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.loads(response.read())
          if not result.get("ok"):
              raise SystemExit("Telegram rechazó el mensaje.")
          print("Mensaje de prueba enviado correctamente.")
          PY
